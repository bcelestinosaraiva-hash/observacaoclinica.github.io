<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>Administração de Comentários | Observação Clínica</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 21px;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .btn {
            border: 0;
            border-radius: 7px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-google {
            background: #ffffff;
            color: #333;
            border: 1px solid #ddd;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .google-logo {
            width: 20px;
            height: 20px;
        }

        .btn-logout {
            background: #111827;
            color: #fff;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .login-box {
            max-width: 500px;
            margin: 80px auto;
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, .06);
        }

        .login-box h2 {
            margin-top: 0;
        }

        .login-box p {
            color: #6b7280;
            line-height: 1.6;
        }

        .dashboard {
            display: none;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat {
            background: #fff;
            padding: 13px 18px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .stat strong {
            display: block;
            font-size: 20px;
        }

        .filters {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
        }

        .filters select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            min-width: 180px;
        }

        .comment-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .user strong {
            display: block;
        }

        .user small {
            color: #6b7280;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-approved {
            background: #ecfdf5;
            color: #047857;
        }

        .status-rejected {
            background: #fef2f2;
            color: #b91c1c;
        }

        .article {
            margin-top: 15px;
            font-size: 14px;
            color: #2563eb;
        }

        .comment-text {
            margin: 15px 0;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-approve {
            background: #059669;
            color: #fff;
        }

        .btn-reject {
            background: #d97706;
            color: #fff;
        }

        .btn-delete {
            background: #dc2626;
            color: #fff;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .comment-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-info {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Moderação de Comentários</h1>

        <div id="adminInfo" class="admin-info" style="display:none;">

            <img id="adminPhoto" src="" alt="Administrador">

            <div>
                <strong id="adminName"></strong>
                <small id="adminEmail"></small>
            </div>

            <button id="logoutBtn" class="btn btn-logout">
                Sair
            </button>

        </div>

    </header>


    <main>

        <!-- LOGIN -->

        <section id="loginBox" class="login-box">

            <h2>Área administrativa</h2>

            <p>
                Faça login com a conta Google autorizada
                para administrar os comentários dos artigos.
            </p>

            <button id="googleLogin" class="btn btn-google">

                <img class="google-logo" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google">

                Entrar com Google

            </button>

            <div id="loginError" class="error"></div>

        </section>


        <!-- DASHBOARD -->

        <section id="dashboard" class="dashboard">

            <div class="top-bar">

                <div>
                    <h2>Comentários</h2>
                    <p>
                        Aprove, reprove ou exclua comentários.
                    </p>
                </div>

                <div class="stats">

                    <div class="stat">
                        <strong id="totalComments">0</strong>
                        Total
                    </div>

                    <div class="stat">
                        <strong id="pendingComments">0</strong>
                        Pendentes
                    </div>

                    <div class="stat">
                        <strong id="approvedComments">0</strong>
                        Aprovados
                    </div>

                    <div class="stat">
                        <strong id="rejectedComments">0</strong>
                        Reprovados
                    </div>

                </div>

            </div>


            <div class="filters">

                <label for="statusFilter">
                    Filtrar:
                </label>

                <select id="statusFilter">

                    <option value="all">
                        Todos
                    </option>

                    <option value="pending">
                        Pendentes
                    </option>

                    <option value="approved">
                        Aprovados
                    </option>

                    <option value="rejected">
                        Reprovados
                    </option>

                </select>

            </div>


            <div id="commentsContainer">

                <div class="loading">
                    Carregando comentários...
                </div>

            </div>

        </section>

    </main>


    <script type="module" src="./admin.js"></script>

</body>

</html>
