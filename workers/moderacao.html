<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderação de comentários</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1c1c1e; }
  h1 { font-size: 20px; }
  .setup { display: flex; gap: 8px; margin-bottom: 24px; }
  .setup input { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  .setup button { padding: 8px 14px; border: none; background: #17181a; color: #fff; border-radius: 6px; cursor: pointer; }
  .item { border: 1px solid #e6e6e9; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .item .meta { font-size: 12.5px; color: #6b6f76; margin-bottom: 6px; }
  .item .texto { font-size: 14px; white-space: pre-wrap; margin-bottom: 10px; }
  .actions button { margin-right: 8px; padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; }
  .actions .approve { background: #eaf7ee; border-color: #b7e0c3; }
  .actions .reject { background: #fdeceb; border-color: #f2b8b3; }
  .empty { color: #8a8d94; font-size: 14px; }
</style>
</head>
<body>

<h1>Moderação de comentários</h1>

<div class="setup">
  <input id="apiBase" placeholder="URL do Worker, ex: https://observacaoclinica.com" />
  <input id="adminToken" placeholder="ADMIN_TOKEN" type="password" />
  <button id="btnLoad">Carregar pendentes</button>
</div>

<div id="list"></div>

<script>
const els = {
  apiBase: document.getElementById("apiBase"),
  adminToken: document.getElementById("adminToken"),
  btnLoad: document.getElementById("btnLoad"),
  list: document.getElementById("list"),
};

els.apiBase.value = localStorage.getItem("mod_apiBase") || "";
els.adminToken.value = localStorage.getItem("mod_adminToken") || "";

els.btnLoad.addEventListener("click", loadPending);

async function loadPending() {
  const base = els.apiBase.value.replace(/\/$/, "");
  const token = els.adminToken.value;
  localStorage.setItem("mod_apiBase", base);
  localStorage.setItem("mod_adminToken", token);

  els.list.innerHTML = "<p class='empty'>Carregando…</p>";

  try {
    const res = await fetch(`${base}/api/admin/comments?status=pending`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) throw new Error("Falha: " + res.status);
    const data = await res.json();
    render(data.comments || []);
  } catch (e) {
    els.list.innerHTML = `<p class="empty">Erro ao carregar: ${e.message}</p>`;
  }
}

function render(items) {
  if (!items.length) {
    els.list.innerHTML = "<p class='empty'>Nenhum comentário pendente.</p>";
    return;
  }

  els.list.innerHTML = items
    .map(
      (c) => `
    <div class="item" data-id="${c.id}">
      <div class="meta">${c.name} · ${c.email} · ${c.slug} · ${c.createdAt}</div>
      <div class="texto"></div>
      <div class="actions">
        <button class="approve" onclick="moderate(${c.id}, 'approve')">Aprovar</button>
        <button class="reject" onclick="moderate(${c.id}, 'reject')">Rejeitar</button>
      </div>
    </div>`
    )
    .join("");

  // texto via textContent para evitar qualquer injeção de HTML
  items.forEach((c) => {
    const el = document.querySelector(`.item[data-id="${c.id}"] .texto`);
    if (el) el.textContent = c.texto;
  });
}

async function moderate(id, action) {
  const base = els.apiBase.value.replace(/\/$/, "");
  const token = els.adminToken.value;

  const res = await fetch(`${base}/api/admin/comments/${id}/${action}`, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}` },
  });

  if (res.ok) {
    document.querySelector(`.item[data-id="${id}"]`)?.remove();
  } else {
    alert("Falha ao moderar comentário.");
  }
}
</script>

</body>
</html>
