<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 153 40" width="153" height="40">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&amp;display=swap');
      .txt-dark { font-family: 'Rubik', Arial, Helvetica, sans-serif; font-weight: 800; fill: #1a1a2e; }
      .txt-blue { font-family: 'Rubik', Arial, Helvetica, sans-serif; font-weight: 800; fill: #1565d8; }
    </style>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fa9f5"/>
      <stop offset="100%" stop-color="#0b57d0"/>
    </linearGradient>
  </defs>

  <!-- Icon: magnifying glass (scaled, shorter handle) -->
  <g transform="translate(-2.02,-2.02) scale(0.44)">
    <!-- ring -->
    <circle cx="45" cy="45" r="30" fill="none" stroke="#1467d1" stroke-width="9"/>

    <!-- handle, starting exactly at the ring's outer edge, same solid color -->
    <line x1="70" y1="70" x2="85" y2="85" stroke="#1467d1" stroke-width="13" stroke-linecap="round"/>

    <!-- heart, balanced spacing top/bottom inside the ring -->
    <path d="M45,69 C32,58.3 25,51.5 25,41.8
             C25,33.1 32,28.3 39,28.3
             C42,28.3 45,31.2 45,35.1
             C45,31.2 48,28.3 51,28.3
             C58,28.3 65,33.1 65,41.8
             C65,51.5 58,58.3 45,69 Z"
          fill="url(#blueGrad)"/>

    <!-- white pulse line across the heart -->
    <polyline points="29,48.6 36,48.6 40,39.9 45,57.4 49,42.8 53,48.6 61,48.6"
              fill="none" stroke="#ffffff" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="41" y="18" font-size="16.5" class="txt-dark">Observação</text>
  <text x="41" y="37" font-size="16.5" class="txt-blue">Clínica</text>
</svg>
