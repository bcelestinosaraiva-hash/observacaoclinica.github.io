<?xml version="1.0"?>
<svg width="152.99999999999997" height="40" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <defs>
  <style>@import url(&#x27;https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&amp;display=swap&#x27;);
      .txt-dark { font-family: &#x27;Rubik&#x27;, Arial, Helvetica, sans-serif; font-weight: 800; fill: #1a1a2e; }
      .txt-blue { font-family: &#x27;Rubik&#x27;, Arial, Helvetica, sans-serif; font-weight: 800; fill: #1565d8; }</style>
  <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#3fa9f5"/>
   <stop offset="100%" stop-color="#0b57d0"/>
  </linearGradient>
 </defs>
 <!-- Icon: magnifying glass (scaled, shorter handle) -->
 <!-- Wordmark -->
 <g class="layer">
  <title>Layer 1</title>
  <g transform="translate(-2.02,-2.02) scale(0.44)" id="svg_1">
   <!-- ring -->
   <circle cx="45" cy="45" r="30" fill="none" stroke="#1467d1" stroke-width="9" id="svg_2"/>
   <!-- handle, starting exactly at the ring's outer edge, same solid color -->
   <line x1="70" y1="70" x2="85" y2="85" stroke="#1467d1" stroke-width="13" stroke-linecap="round" id="svg_3"/>
   <!-- heart, balanced spacing top/bottom inside the ring -->
   <path d="m45,69c-13,-10.7 -20,-17.5 -20,-27.2c0,-8.7 7,-13.5 14,-13.5c3,0 6,2.9 6,6.8c0,-3.9 3,-6.8 6,-6.8c7,0 14,4.8 14,13.5c0,9.7 -7,16.5 -20,27.2z" fill="url(#blueGrad)" id="svg_4"/>
   <!-- white pulse line across the heart -->
   <polyline points="29,48.6 36,48.6 40,39.9 45,57.4 49,42.8 53,48.6 61,48.6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="svg_5"/>
  </g>
  <text x="41" y="18" font-size="18" class="txt-dark" id="svg_6" transform="matrix(1 0 0 1 -5 2)">Observação</text>
  <text x="41" y="37" font-size="16.5" class="txt-blue" id="svg_7" transform="matrix(1 0 0 1 8 -3)">Clínica</text>
 </g>
</svg>