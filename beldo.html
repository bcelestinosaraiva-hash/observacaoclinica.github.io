<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>


    <style>
        /* =========================================================
   SISTEMA DE COMENTÁRIOS
   OBSERVAÇÃO CLÍNICA
   ========================================================= */

        .comments-section {
            width: 100%;
            max-width: 820px;
            margin: 50px auto;
            padding: 0 18px;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }


        /* =========================================================
   CABEÇALHO
   ========================================================= */

        .comments-header {
            margin-bottom: 25px;
        }

        .comments-eyebrow {
            display: inline-block;
            margin-bottom: 7px;

            color: #0b72b9;

            font-size: 13px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .comments-header h2 {
            margin: 0 0 8px;

            color: #111827;

            font-size: 28px;
            line-height: 1.25;
        }

        .comments-header p {
            margin: 0;

            color: #6b7280;

            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================================================
   ÁREA DE LOGIN
   ========================================================= */

        .login-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 20px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .04);
        }

        .login-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .login-info strong {
            color: #111827;

            font-size: 15px;
        }

        .login-info span {
            color: #6b7280;

            font-size: 14px;
            line-height: 1.5;
        }


        /* =========================================================
   BOTÃO GOOGLE
   ========================================================= */

        .google-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            width: 100%;
            max-width: 220px;

            min-height: 44px;

            padding: 10px 16px;

            background: #ffffff;
            color: #1f1f1f;

            border: 1px solid #dadce0;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background-color .15s ease,
                box-shadow .15s ease,
                border-color .15s ease,
                transform .1s ease;
        }

        .google-login:hover {
            background: #f8f9fa;

            border-color: #c8cdd1;

            box-shadow:
                0 1px 3px rgba(60, 64, 67, .2);
        }

        .google-login:active {
            background: #f1f3f4;

            transform: translateY(1px);
        }

        .google-login:focus-visible {
            outline: 3px solid rgba(11, 114, 185, .22);
            outline-offset: 2px;
        }

        .google-login:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .google-logo {
            width: 20px;
            height: 20px;

            flex: 0 0 20px;
        }


        /* =========================================================
   UTILIZADOR LOGADO
   ========================================================= */

        .user-card {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 16px 18px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            margin-bottom: 18px;
        }

        .user-info {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .user-info>div {
            display: flex;
            flex-direction: column;

            gap: 3px;

            min-width: 0;
        }

        .user-info strong {
            color: #111827;

            font-size: 15px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-info span {
            color: #6b7280;

            font-size: 13px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-photo {
            width: 44px;
            height: 44px;

            flex: 0 0 44px;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid #ffffff;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, .12);
        }


        /* =========================================================
   BOTÃO SAIR
   ========================================================= */

        .logout-button {
            border: 1px solid #d1d5db;

            background: #ffffff;
            color: #374151;

            border-radius: 7px;

            padding: 8px 14px;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background-color .15s ease,
                border-color .15s ease;
        }

        .logout-button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .logout-button:focus-visible {
            outline: 3px solid rgba(11, 114, 185, .18);
            outline-offset: 2px;
        }


        /* =========================================================
   FORMULÁRIO
   ========================================================= */

        .comment-form-card {
            margin-bottom: 35px;

            padding: 20px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .04);
        }

        #comment-form {
            width: 100%;
        }

        #comment-form label {
            display: block;

            margin-bottom: 8px;

            color: #111827;

            font-size: 15px;
            font-weight: 600;
        }

        #comment-text {
            display: block;

            width: 100%;
            min-height: 125px;

            padding: 13px 14px;

            resize: vertical;

            background: #ffffff;
            color: #1f2937;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;

            transition:
                border-color .15s ease,
                box-shadow .15s ease;
        }

        #comment-text::placeholder {
            color: #9ca3af;
        }

        #comment-text:hover {
            border-color: #9ca3af;
        }

        #comment-text:focus {
            outline: none;

            border-color: #0b72b9;

            box-shadow:
                0 0 0 3px rgba(11, 114, 185, .12);
        }


        /* =========================================================
   RODAPÉ DO FORMULÁRIO
   ========================================================= */

        .comment-form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-top: 12px;
        }

        .comment-form-footer small {
            color: #6b7280;

            font-size: 12px;
            line-height: 1.5;
        }


        /* =========================================================
   BOTÃO ENVIAR
   ========================================================= */

        #submit-comment {
            flex: 0 0 auto;

            min-height: 42px;

            padding: 10px 18px;

            background: #0b72b9;
            color: #ffffff;

            border: 0;
            border-radius: 8px;

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background-color .15s ease,
                transform .1s ease,
                box-shadow .15s ease;
        }

        #submit-comment:hover {
            background: #095f9b;

            box-shadow:
                0 2px 6px rgba(11, 114, 185, .18);
        }

        #submit-comment:active {
            transform: translateY(1px);
        }

        #submit-comment:focus-visible {
            outline: 3px solid rgba(11, 114, 185, .20);
            outline-offset: 2px;
        }

        #submit-comment:disabled {
            opacity: .6;

            cursor: not-allowed;

            box-shadow: none;
        }


        /* =========================================================
   MENSAGEM
   ========================================================= */

        #comment-message {
            margin-top: 12px;

            font-size: 14px;
            line-height: 1.5;
        }

        #comment-message:empty {
            display: none;
        }


        /* =========================================================
   COMENTÁRIOS PUBLICADOS
   ========================================================= */

        .published-comments {
            margin-top: 30px;
        }

        .published-comments h3 {
            margin: 0 0 18px;

            color: #111827;

            font-size: 20px;
            line-height: 1.3;
        }


        /* =========================================================
   LISTA
   ========================================================= */

        #comments-list {
            display: flex;
            flex-direction: column;

            gap: 14px;
        }


        /* =========================================================
   COMENTÁRIO
   ========================================================= */

        .comment-item {
            padding: 18px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        .comment-item-header {
            display: flex;
            align-items: center;

            gap: 11px;

            margin-bottom: 12px;
        }

        .comment-item-photo {
            width: 40px;
            height: 40px;

            flex: 0 0 40px;

            object-fit: cover;

            border-radius: 50%;
        }

        .comment-item-user {
            display: flex;
            flex-direction: column;

            gap: 2px;
        }

        .comment-item-user strong {
            color: #111827;

            font-size: 14px;
        }

        .comment-date {
            color: #9ca3af;

            font-size: 12px;
        }

        .comment-item-text {
            margin: 0;

            color: #374151;

            font-size: 14px;
            line-height: 1.7;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        /* =========================================================
   CARREGANDO
   ========================================================= */

        .comments-loading {
            margin: 0;

            padding: 25px;

            color: #6b7280;

            background: #f9fafb;

            border: 1px solid #e5e7eb;
            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }


        /* =========================================================
   SEM COMENTÁRIOS
   ========================================================= */

        .no-comments {
            margin: 0;

            padding: 25px;

            color: #6b7280;

            background: #f9fafb;

            border: 1px dashed #d1d5db;
            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }


        /* =========================================================
   RESPONSIVO
   ========================================================= */

        @media (max-width: 700px) {

            .comments-section {
                margin: 35px auto;

                padding: 0 14px;
            }


            .comments-header h2 {
                font-size: 24px;
            }


            .login-card {
                align-items: stretch;

                flex-direction: column;
            }


            .google-login {
                max-width: none;
            }


            .user-card {
                align-items: flex-start;

                flex-direction: column;
            }


            .logout-button {
                width: 100%;
            }


            .comment-form-footer {
                align-items: stretch;

                flex-direction: column;
            }


            #submit-comment {
                width: 100%;
            }


            .comment-form-card {
                padding: 16px;
            }


            .comment-item {
                padding: 15px;
            }

        }


        /* =========================================================
   MOBILE PEQUENO
   ========================================================= */

        @media (max-width: 400px) {

            .comments-header h2 {
                font-size: 22px;
            }


            .comments-header p {
                font-size: 14px;
            }


            .login-card {
                padding: 16px;
            }


            .user-card {
                padding: 14px;
            }


            #comment-text {
                min-height: 115px;
            }

        }


        /* =========================================================
   ACESSIBILIDADE
   ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .google-login,
            .logout-button,
            #comment-text,
            #submit-comment {
                transition: none;
            }

        }

        .google-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            max-width: 320px;

            padding: 11px 18px;

            background: #ffffff;
            color: #1f1f1f;

            border: 1px solid #dadce0;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .google-login:hover {
            background: #f8f9fa;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.2);
        }

        .google-login:active {
            background: #f1f3f4;
        }

        .google-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .google-logo {
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
        }
    </style>
    </head>
    <section id="comentarios" class="comments-section" data-article-id="na-gravidez-pode-tomar-paracetamol"
        data-article-title="Na gravidez pode tomar paracetamol?">

        <div class="comments-header">
            <span class="comments-eyebrow">Discussão</span>

            <h2>Comentários</h2>

            <p>
                Compartilhe sua dúvida ou experiência sobre este artigo.
            </p>
        </div>


        <!-- LOGIN -->

        <div id="login-area" class="login-card">

            <div class="login-info">

                <strong>Quer deixar um comentário?</strong>

                <span>
                    Entre com sua conta Google para comentar.
                </span>

            </div>


            <button id="google-login" type="button" class="google-login">

                <svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4"
                        d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z" />

                    <path fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.55 0-4.71-1.72-5.49-4.04H3.27v2.53A9.74 9.74 0 0 0 12 21.5z" />

                    <path fill="#FBBC05"
                        d="M6.51 13.58A5.86 5.86 0 0 1 6.2 12c0-.55.11-1.09.31-1.58V7.89H3.27A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.02 4.11l3.24-2.53z" />

                    <path fill="#EA4335"
                        d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.48 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.73 5.39l3.24 2.53C7.29 8.1 9.45 6.38 12 6.38z" />
                </svg>

                <span>Entrar com Google</span>

            </button>

        </div>


        <!-- UTILIZADOR LOGADO -->

        <div id="user-area" class="user-card" hidden>

            <div class="user-info">

                <img id="user-photo" class="user-photo" width="44" height="44" alt="Foto do utilizador">

                <div>

                    <strong id="user-name">
                        Utilizador
                    </strong>

                    <span id="user-email"></span>

                </div>

            </div>


            <button id="logout" type="button" class="logout-button">
                Sair
            </button>

        </div>


        <!-- FORMULÁRIO -->

        <div id="comments-area" class="comment-form-card" hidden>

            <form id="comment-form">

                <label for="comment-text">
                    Seu comentário
                </label>

                <textarea id="comment-text" name="comment" rows="5" maxlength="1000"
                    placeholder="Escreva seu comentário..." required></textarea>

                <div class="comment-form-footer">

                    <small>
                        Seu comentário será analisado antes de ser publicado.
                    </small>

                    <button id="submit-comment" type="submit">
                        Enviar comentário
                    </button>

                </div>

            </form>

            <div id="comment-message" role="status" aria-live="polite"></div>

        </div>


        <!-- COMENTÁRIOS APROVADOS -->

        <div class="published-comments">

            <h3>
                Comentários dos leitores
            </h3>

            <div id="comments-list">

                <p class="comments-loading">
                    Carregando comentários...
                </p>

            </div>

        </div>

    </section>


    <script type="module" src="/js/comments.js"></script>

    <script type="module" src="login.js" defer></script>
</body>

</html>
