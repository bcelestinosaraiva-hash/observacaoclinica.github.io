<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comentários — Na gravidez pode tomar paracetamol?</title>

    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="css/comments-section.css">

    <style>
        /* =============================================================
   SISTEMA DE COMENTÁRIOS — OBSERVAÇÃO CLÍNICA
   Estilo para artigos de saúde
   =============================================================

   Índice
   1. Tokens (cores, espaçamento, tipografia, sombra)
   2. Base da secção
   3. Cabeçalho
   4. Cartão de login
   5. Botão Google
   6. Utilizador autenticado
   7. Botão sair
   8. Formulário de comentário
   9. Botão enviar
   10. Mensagem de estado
   11. Lista de comentários publicados
   12. Estado "a carregar" / "sem comentários"
   13. Responsivo
   14. Acessibilidade
   ============================================================= */


        /* -------------------------------------------------------------
   1. TOKENS
   Paleta pensada para saúde: azul-petróleo clínico (confiança,
   calma), neutros quentes para o texto, verde reservado para
   confirmações. Evita o azul genérico "corporate" puro.
   ------------------------------------------------------------- */

        .comments-section {
            /* Cor */
            --color-primary: #0c6e8c;
            --color-primary-dark: #08526a;
            --color-primary-soft: #e6f2f6;
            --color-success: #157a5e;
            --color-success-soft: #e5f5f0;

            --color-ink: #142330;
            --color-text: #3d4a57;
            --color-muted: #6b7785;
            --color-faint: #97a2ac;

            --color-surface: #ffffff;
            --color-surface-alt: #f7f9fa;
            --color-border: #e1e6ea;
            --color-border-strong: #c7ced4;

            /* Tipografia */
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            --fs-eyebrow: 12.5px;
            --fs-sm: 13px;
            --fs-base: 14.5px;
            --fs-md: 15px;
            --fs-lg: 20px;
            --fs-xl: 28px;

            /* Espaçamento (escala de 4px) */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-7: 32px;

            /* Raio e sombra */
            --radius-sm: 7px;
            --radius-md: 10px;
            --radius-lg: 12px;
            --shadow-card: 0 1px 2px rgba(20, 35, 48, .04), 0 4px 14px rgba(20, 35, 48, .05);
            --shadow-hover: 0 4px 16px rgba(12, 110, 140, .12);

            --ease: cubic-bezier(.4, 0, .2, 1);
        }


        /* -------------------------------------------------------------
   2. BASE DA SECÇÃO
   ------------------------------------------------------------- */

        .comments-section {
            width: 100%;
            max-width: 820px;
            margin: 56px auto;
            padding: 0 18px;

            color: var(--color-text);
            font-family: var(--font-body);
        }


        /* -------------------------------------------------------------
   3. CABEÇALHO
   ------------------------------------------------------------- */

        .comments-header {
            margin-bottom: var(--space-6);
        }

        .comments-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: var(--space-2);

            color: var(--color-primary);

            font-size: var(--fs-eyebrow);
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .comments-eyebrow::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-primary);
        }

        .comments-header h2 {
            margin: 0 0 var(--space-2);

            color: var(--color-ink);

            font-size: var(--fs-xl);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -.01em;
        }

        .comments-header p {
            margin: 0;
            max-width: 56ch;

            color: var(--color-muted);

            font-size: var(--fs-md);
            line-height: 1.6;
        }


        /* -------------------------------------------------------------
   4. CARTÃO DE LOGIN
   ------------------------------------------------------------- */

        .login-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-5);

            padding: var(--space-5);

            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        .login-info {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .login-info strong {
            color: var(--color-ink);
            font-size: var(--fs-md);
            font-weight: 600;
        }

        .login-info span {
            color: var(--color-muted);
            font-size: var(--fs-base);
            line-height: 1.5;
        }


        /* -------------------------------------------------------------
   5. BOTÃO GOOGLE
   ------------------------------------------------------------- */

        .google-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);

            width: 100%;
            max-width: 260px;
            min-height: 44px;

            padding: 10px var(--space-4);

            background: var(--color-surface);
            color: var(--color-ink);

            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-sm);

            font-family: var(--font-body);
            font-size: var(--fs-base);
            font-weight: 500;

            cursor: pointer;
            transition: background-color .15s var(--ease), box-shadow .15s var(--ease),
                border-color .15s var(--ease), transform .1s var(--ease);
        }

        .google-login:hover {
            background: var(--color-surface-alt);
            border-color: var(--color-faint);
            box-shadow: 0 1px 3px rgba(20, 35, 48, .1);
        }

        .google-login:active {
            background: #eef1f3;
            transform: translateY(1px);
        }

        .google-login:focus-visible {
            outline: 3px solid rgba(12, 110, 140, .22);
            outline-offset: 2px;
        }

        .google-login:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .google-logo {
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
        }


        /* -------------------------------------------------------------
   6. UTILIZADOR AUTENTICADO
   ------------------------------------------------------------- */

        .user-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-5);

            padding: var(--space-4) var(--space-5);
            margin-bottom: var(--space-5);

            background: var(--color-surface-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            min-width: 0;
        }

        .user-info>div {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .user-info strong {
            color: var(--color-ink);
            font-size: var(--fs-md);

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-info span {
            color: var(--color-muted);
            font-size: var(--fs-sm);

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-photo {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;

            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--color-surface);
            box-shadow: 0 1px 4px rgba(20, 35, 48, .14);
        }


        /* -------------------------------------------------------------
   7. BOTÃO SAIR
   ------------------------------------------------------------- */

        .logout-button {
            padding: 8px 14px;

            background: var(--color-surface);
            color: var(--color-text);

            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-sm);

            font-family: var(--font-body);
            font-size: var(--fs-sm);
            font-weight: 600;

            cursor: pointer;
            transition: background-color .15s var(--ease), border-color .15s var(--ease);
        }

        .logout-button:hover {
            background: var(--color-surface-alt);
            border-color: var(--color-faint);
        }

        .logout-button:focus-visible {
            outline: 3px solid rgba(12, 110, 140, .18);
            outline-offset: 2px;
        }


        /* -------------------------------------------------------------
   8. FORMULÁRIO DE COMENTÁRIO
   ------------------------------------------------------------- */

        .comment-form-card {
            margin-bottom: var(--space-7);

            padding: var(--space-5);

            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        #comment-form {
            width: 100%;
        }

        #comment-form label {
            display: block;
            margin-bottom: var(--space-2);

            color: var(--color-ink);
            font-size: var(--fs-md);
            font-weight: 600;
        }

        #comment-text {
            display: block;
            width: 100%;
            min-height: 125px;

            padding: 13px 14px;
            resize: vertical;

            background: var(--color-surface);
            color: var(--color-text);

            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-sm);

            font-family: inherit;
            font-size: var(--fs-base);
            line-height: 1.6;

            transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
        }

        #comment-text::placeholder {
            color: var(--color-faint);
        }

        #comment-text:hover {
            border-color: var(--color-faint);
        }

        #comment-text:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(12, 110, 140, .12);
        }

        .comment-form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);

            margin-top: var(--space-3);
        }

        .comment-form-footer small {
            color: var(--color-muted);
            font-size: var(--fs-sm);
            line-height: 1.5;
        }


        /* -------------------------------------------------------------
   9. BOTÃO ENVIAR
   ------------------------------------------------------------- */

        #submit-comment {
            flex: 0 0 auto;
            min-height: 42px;

            padding: 10px var(--space-5);

            background: var(--color-primary);
            color: #ffffff;

            border: 0;
            border-radius: var(--radius-sm);

            font-family: inherit;
            font-size: var(--fs-base);
            font-weight: 600;

            cursor: pointer;
            transition: background-color .15s var(--ease), transform .1s var(--ease),
                box-shadow .15s var(--ease);
        }

        #submit-comment:hover {
            background: var(--color-primary-dark);
            box-shadow: var(--shadow-hover);
        }

        #submit-comment:active {
            transform: translateY(1px);
        }

        #submit-comment:focus-visible {
            outline: 3px solid rgba(12, 110, 140, .22);
            outline-offset: 2px;
        }

        #submit-comment:disabled {
            opacity: .6;
            cursor: not-allowed;
            box-shadow: none;
        }


        /* -------------------------------------------------------------
   10. MENSAGEM DE ESTADO
   ------------------------------------------------------------- */

        #comment-message {
            margin-top: var(--space-3);
            font-size: var(--fs-base);
            line-height: 1.5;
        }

        #comment-message:empty {
            display: none;
        }

        #comment-message.is-success {
            color: var(--color-success);
        }

        #comment-message.is-error {
            color: #b3261e;
        }


        /* -------------------------------------------------------------
   11. COMENTÁRIOS PUBLICADOS
   ------------------------------------------------------------- */

        .published-comments {
            margin-top: var(--space-7);
        }

        .published-comments h3 {
            margin: 0 0 var(--space-5);

            color: var(--color-ink);
            font-size: var(--fs-lg);
            font-weight: 700;
            line-height: 1.3;
        }

        #comments-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .comment-item {
            padding: var(--space-5);

            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
        }

        .comment-item-header {
            display: flex;
            align-items: center;
            gap: 11px;

            margin-bottom: var(--space-3);
        }

        .comment-item-photo {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;

            object-fit: cover;
            border-radius: 50%;
        }

        .comment-item-user {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .comment-item-user strong {
            color: var(--color-ink);
            font-size: var(--fs-base);
        }

        .comment-date {
            color: var(--color-faint);
            font-size: 12px;
        }

        .comment-item-text {
            margin: 0;

            color: var(--color-text);
            font-size: var(--fs-base);
            line-height: 1.7;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }


        /* -------------------------------------------------------------
   12. ESTADO "A CARREGAR" / "SEM COMENTÁRIOS"
   ------------------------------------------------------------- */

        .comments-loading,
        .no-comments {
            margin: 0;
            padding: 25px;

            color: var(--color-muted);
            background: var(--color-surface-alt);
            border-radius: var(--radius-md);

            text-align: center;
            font-size: var(--fs-base);
        }

        .comments-loading {
            border: 1px solid var(--color-border);
        }

        .no-comments {
            border: 1px dashed var(--color-border-strong);
        }


        /* -------------------------------------------------------------
   13. RESPONSIVO
   ------------------------------------------------------------- */

        @media (max-width: 700px) {
            .comments-section {
                margin: 36px auto;
                padding: 0 14px;
            }

            .comments-header h2 {
                font-size: 24px;
            }

            .login-card {
                align-items: stretch;
                flex-direction: column;
            }

            .google-login {
                max-width: none;
            }

            .user-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .logout-button {
                width: 100%;
            }

            .comment-form-footer {
                align-items: stretch;
                flex-direction: column;
            }

            #submit-comment {
                width: 100%;
            }

            .comment-form-card {
                padding: var(--space-4);
            }

            .comment-item {
                padding: var(--space-4);
            }
        }

        @media (max-width: 400px) {
            .comments-header h2 {
                font-size: 22px;
            }

            .comments-header p {
                font-size: var(--fs-base);
            }

            .login-card {
                padding: var(--space-4);
            }

            .user-card {
                padding: 14px;
            }

            #comment-text {
                min-height: 115px;
            }
        }


        /* -------------------------------------------------------------
   14. ACESSIBILIDADE
   ------------------------------------------------------------- */

        @media (prefers-reduced-motion: reduce) {

            .google-login,
            .logout-button,
            #comment-text,
            #submit-comment {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <section id="comentarios" class="comments-section" data-article-id="na-gravidez-pode-tomar-paracetamol"
        data-article-title="Na gravidez pode tomar paracetamol?">

        <div class="comments-header">
            <span class="comments-eyebrow">Discussão</span>
            <h2>Comentários</h2>
            <p>Compartilhe sua dúvida ou experiência sobre este artigo.</p>
        </div>

        <!-- LOGIN -->
        <div id="login-area" class="login-card">

            <div class="login-info">
                <strong>Quer deixar um comentário?</strong>
                <span>Entre com sua conta Google para comentar.</span>
            </div>

            <button id="google-login" type="button" class="google-login">
                <svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4"
                        d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z" />
                    <path fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.55 0-4.71-1.72-5.49-4.04H3.27v2.53A9.74 9.74 0 0 0 12 21.5z" />
                    <path fill="#FBBC05"
                        d="M6.51 13.58A5.86 5.86 0 0 1 6.2 12c0-.55.11-1.09.31-1.58V7.89H3.27A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.02 4.11l3.24-2.53z" />
                    <path fill="#EA4335"
                        d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.48 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.73 5.39l3.24 2.53C7.29 8.1 9.45 6.38 12 6.38z" />
                </svg>
                <span>Entrar com Google</span>
            </button>

        </div>

        <!-- UTILIZADOR LOGADO -->
        <div id="user-area" class="user-card" hidden>

            <div class="user-info">
                <img id="user-photo" class="user-photo" width="44" height="44" src="" alt="">

                <div>
                    <strong id="user-name">Utilizador</strong>
                    <span id="user-email"></span>
                </div>
            </div>

            <button id="logout" type="button" class="logout-button">Sair</button>

        </div>

        <!-- FORMULÁRIO -->
        <div id="comments-area" class="comment-form-card" hidden>

            <form id="comment-form" novalidate>

                <label for="comment-text">Seu comentário</label>

                <textarea id="comment-text" name="comment" rows="5" maxlength="1000"
                    placeholder="Escreva seu comentário..." aria-describedby="comment-hint" required></textarea>

                <div class="comment-form-footer">
                    <small id="comment-hint">Seu comentário será analisado antes de ser publicado.</small>
                    <button id="submit-comment" type="submit">Enviar comentário</button>
                </div>

            </form>

            <div id="comment-message" role="status" aria-live="polite"></div>

        </div>

        <!-- COMENTÁRIOS APROVADOS -->
        <div class="published-comments">

            <h3>Comentários dos leitores</h3>

            <div id="comments-list" aria-live="polite">
                <p class="comments-loading">Carregando comentários...</p>
            </div>

        </div>

    </section>

    <script type="module" src="/js/comments.js"></script>
    <script type="module" src="login.js" defer></script>

</body>

</html>
